<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patreon floating element</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="heading">
        <div>
          <h1>Engagement bar</h1>
          <p id="status">Checking this page…</p>
        </div>
        <label class="switch" aria-label="Hide floating engagement bar">
          <input id="hidden-toggle" type="checkbox" checked />
          <span class="slider"></span>
        </label>
      </div>
      <p class="hint">
        Controls Patreon's floating like, comment, repost, and share bar.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
