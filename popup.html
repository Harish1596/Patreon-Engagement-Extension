<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patreon floating element</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="heading">
        <div>
          <h1>Floating element</h1>
          <p id="status">Checking this page…</p>
        </div>
        <label class="switch" aria-label="Hide selected element">
          <input id="hidden-toggle" type="checkbox" checked />
          <span class="slider"></span>
        </label>
      </div>

      <button id="pick" type="button">Select element on page</button>
      <button id="forget" class="secondary" type="button" hidden>
        Forget selected element
      </button>
      <p class="hint">
        After selecting, the element is hidden by default. Press Escape while
        selecting to cancel.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
