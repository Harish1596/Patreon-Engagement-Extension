<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Post export formats</title>
    <link rel="stylesheet" href="chooser.css" />
  </head>
  <body>
    <main aria-label="Post export formats">
      <button type="button" data-format="pdf" aria-describedby="pdf-help" disabled>PDF</button>
      <button type="button" data-format="epub" aria-describedby="epub-help" disabled>EPUB</button>
      <button type="button" data-format="markdown" aria-describedby="markdown-help" disabled>Markdown</button>
      <div class="format-help">
        <p id="pdf-help">PDF: Print, or save as PDF in the browser dialog.</p>
        <p id="epub-help">EPUB: Read in an ebook reader.</p>
        <p id="markdown-help">Markdown: Editable plain text.</p>
      </div>
    </main>
    <script src="chooser.js"></script>
  </body>
</html>
