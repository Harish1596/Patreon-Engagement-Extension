<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collection export formats</title>
    <link rel="stylesheet" href="collection-chooser.css" />
  </head>
  <body>
    <main aria-label="Collection export formats">
      <section aria-label="One book">
        <p>One book</p>
        <button type="button" data-format="epub-book" disabled>Single EPUB</button>
      </section>
      <section aria-label="Separate files">
        <p>Separate files (ZIP)</p>
        <div class="formats"><button type="button" data-format="epub" disabled>EPUB</button>
        <button type="button" data-format="markdown" disabled>Markdown</button></div>
      </section>
    </main>
    <script src="collection-chooser.js"></script>
  </body>
</html>
