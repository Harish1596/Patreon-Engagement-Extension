<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collection export formats</title>
    <link rel="stylesheet" href="collection-chooser.css" />
  </head>
  <body>
    <main aria-label="Collection export formats">
      <button type="button" data-format="epub-book" aria-label="Single EPUB" aria-describedby="book-description" disabled>
        <span class="choice"><span class="title">Single EPUB</span><span class="description" id="book-description">All chapters together in one book.</span></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4" /></svg>
      </button>
      <button type="button" data-format="epub" aria-label="EPUB" aria-describedby="epub-description" disabled>
        <span class="choice"><span class="title">EPUB <span class="type">ZIP</span></span><span class="description" id="epub-description">A separate EPUB for each chapter.</span></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4" /></svg>
      </button>
      <button type="button" data-format="markdown" aria-label="Markdown" aria-describedby="markdown-description" disabled>
        <span class="choice"><span class="title">Markdown <span class="type">ZIP</span></span><span class="description" id="markdown-description">A separate Markdown file for each chapter.</span></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4" /></svg>
      </button>
    </main>
    <script src="collection-chooser.js"></script>
  </body>
</html>
