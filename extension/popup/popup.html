<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patreon Reader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="app-header">
        <img
          class="app-mark"
          src="../icons/engagement-bar.svg"
          width="38"
          height="38"
          alt=""
        />
        <div class="header-copy">
          <h1>Post preferences</h1>
          <p id="status" data-tone="loading" aria-live="polite">
            Checking Patreon…
          </p>
        </div>
      </header>

      <label class="setting" for="hidden-toggle">
        <span class="setting-copy">
          <span class="setting-title">Hide Engagement Bar</span>
          <span class="setting-description">Likes, comments, reposts and shares</span>
        </span>
        <span class="switch">
          <input
            id="hidden-toggle"
            type="checkbox"
            role="switch"
            aria-label="Hide engagement bar"
            checked
          />
          <span class="slider" aria-hidden="true"></span>
        </span>
      </label>

      <label class="setting" for="reader-toggle">
        <span class="setting-copy">
          <span class="setting-title">Enable Reader Customization</span>
          <span class="setting-description">Adds Aa controls to post actions</span>
        </span>
        <span class="switch">
          <input id="reader-toggle" type="checkbox" role="switch"
            aria-label="Enable Reader Customization" disabled />
          <span class="slider" aria-hidden="true"></span>
        </span>
      </label>
    </main>
    <script src="../shared/extension.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
