<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patreon Reader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="app-header">
        <img
          class="app-mark"
          src="../icons/reader.svg"
          width="38"
          height="38"
          alt=""
        />
        <div class="header-copy">
          <div class="identity-row">
            <h1>Patreon Reader</h1>
            <span id="version" class="version" hidden></span>
          </div>
          <p class="tagline">Reading comfort. Offline access.</p>
        </div>
      </header>

      <section class="preferences" aria-labelledby="preferences-heading">
        <h2 id="preferences-heading">Reading preferences</h2>
        <label class="setting" for="hidden-toggle">
          <span class="setting-copy">
            <span class="setting-title">Hide Engagement Bar</span>
            <span class="setting-description">Likes, comments, reposts and shares</span>
          </span>
          <span class="switch">
            <input
              id="hidden-toggle"
              type="checkbox"
              role="switch"
              aria-label="Hide engagement bar"
              checked
            />
            <span class="slider" aria-hidden="true"></span>
          </span>
        </label>

        <label class="setting" for="reader-toggle">
          <span class="setting-copy">
            <span class="setting-title">Enable Reader Customization</span>
            <span class="setting-description">Adds Aa controls to post actions</span>
          </span>
          <span class="switch">
            <input id="reader-toggle" type="checkbox" role="switch"
              aria-label="Enable Reader Customization" disabled />
            <span class="slider" aria-hidden="true"></span>
          </span>
        </label>
      </section>
      <p id="preferences-error" role="alert" hidden></p>
      <section class="support" aria-labelledby="support-heading">
        <h2 id="support-heading">Community</h2>
        <!-- Brand marks: Simple Icons (CC0). -->
        <nav class="community-links" aria-labelledby="support-heading">
          <a class="community-link" id="discord-link" target="_blank" rel="noopener noreferrer"
            aria-disabled="true" title="Opens in a new tab">
            <svg class="site-logo" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
              <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.516.074.074 0 0 0-.079.037c-.211.375-.445.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.618-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.771 1.363 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03ZM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.419 0 1.334-.955 2.419-2.157 2.419Zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.419 0 1.334-.946 2.419-2.157 2.419Z" />
            </svg>
            <span>Discord</span>
          </a>
          <a class="community-link" id="github-link" target="_blank" rel="noopener noreferrer"
            aria-disabled="true" title="Opens in a new tab">
            <svg class="site-logo" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
              <path d="M12 .297C5.37.297 0 5.67 0 12.297c0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.043-1.61-4.043-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.084 1.838 1.237 1.838 1.237 1.07 1.835 2.807 1.305 3.492.998.108-.776.418-1.305.762-1.605-2.665-.3-5.467-1.334-5.467-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23a11.51 11.51 0 0 1 3-.405c1.02.005 2.045.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.608-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
            </svg>
            <span>GitHub</span>
          </a>
        </nav>
      </section>
    </main>
    <script src="../shared/extension.js"></script>
    <script src="links.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
