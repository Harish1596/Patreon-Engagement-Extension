<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title description">
  <title id="title">Patreon Reader marquee</title>
  <desc id="description">Patreon Reader. Your posts. Your reading style. Customize fonts, colors and spacing. Hide the floating engagement bar.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13234c"/>
      <stop offset="1" stop-color="#2457d6"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="560" fill="url(#background)"/>
  <circle cx="1200" cy="290" r="350" fill="#fff" opacity=".04"/>
  <circle cx="1200" cy="290" r="260" fill="#fff" opacity=".04"/>
  <image href="../extension/icons/reader.svg" x="1010" y="140" width="230" height="230"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="100" font-size="30" font-weight="700" fill="#d4e1ff">Patreon Reader</text>
    <text x="76" y="211" font-size="66" font-weight="750" letter-spacing="-1.6" fill="#fff">Your posts.</text>
    <text x="76" y="292" font-size="66" font-weight="750" letter-spacing="-1.6" fill="#fff">Your reading style.</text>
    <text x="80" y="354" font-size="25" fill="#d4e1ff">Customize fonts, colors &amp; spacing.</text>
    <text x="80" y="394" font-size="25" fill="#d4e1ff">Hide the floating engagement bar.</text>
    <text x="80" y="488" font-size="20" font-weight="600" fill="#fff">Less clutter. More reading.</text>
  </g>
  <g stroke="#fff" stroke-opacity=".6" stroke-width="2">
    <circle cx="1038" cy="426" r="17" fill="#fff"/>
    <circle cx="1096" cy="426" r="17" fill="#f4ecd8"/>
    <circle cx="1154" cy="426" r="17" fill="#e3eddf"/>
    <circle cx="1212" cy="426" r="17" fill="#202124"/>
  </g>
</svg>
