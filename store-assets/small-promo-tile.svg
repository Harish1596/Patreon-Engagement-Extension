<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title description">
  <title id="title">Patreon Reader promotional tile</title>
  <desc id="description">An open-book icon with a gold bookmark. Patreon Reader: Your posts. Your reading style. Fonts, colors, spacing, and less clutter.</desc>
  <defs>
    <linearGradient id="background" x1="24" y1="18" x2="416" y2="262" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13234c"/>
      <stop offset="1" stop-color="#2457d6"/>
    </linearGradient>
  </defs>

  <rect width="440" height="280" fill="url(#background)"/>
  <circle cx="433" cy="229" r="146" fill="#fff" opacity=".045"/>
  <circle cx="433" cy="229" r="108" fill="#fff" opacity=".035"/>
  <image href="../extension/icons/reader.svg" x="28" y="25" width="38" height="38"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="78" y="51" font-size="23" font-weight="700" fill="#fff">Patreon Reader</text>
    <text x="28" y="113" font-size="34" font-weight="750" letter-spacing="-.8" fill="#fff">Your posts.</text>
    <text x="28" y="153" font-size="34" font-weight="750" letter-spacing="-.8" fill="#fff">Your reading style.</text>
    <text x="29" y="186" font-size="15" fill="#d4e1ff">Fonts, colors &amp; spacing.</text>
    <text x="29" y="245" font-size="14" font-weight="600" fill="#fff">Less clutter. More reading.</text>
  </g>
  <g stroke="#fff" stroke-opacity=".6" stroke-width="1">
    <circle cx="336" cy="239" r="9" fill="#fff"/>
    <circle cx="361" cy="239" r="9" fill="#f4ecd8"/>
    <circle cx="386" cy="239" r="9" fill="#e3eddf"/>
    <circle cx="411" cy="239" r="9" fill="#202124"/>
  </g>
</svg>
